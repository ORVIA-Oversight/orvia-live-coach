name: Restore recovered Live Coach source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore recovered text source
        run: |
          test -f recovery/source-text.tar.xz
          tar -xJf recovery/source-text.tar.xz -C .
          git status --short

      - name: Commit restored source
        run: |
          git config user.name "ORVIA Recovery Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Restore recovered ORVIA Live Coach Customer Zero source"
          git push origin HEAD:main
